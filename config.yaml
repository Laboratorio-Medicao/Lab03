# Configuração do pipeline. Uso: python -m pipeline --config config.yaml
#
# O token do GitHub NÃO fica aqui: defina a variável de ambiente indicada em
# `github.token_env` (export GITHUB_TOKEN="...").

github:
  token_env: GITHUB_TOKEN        # nome da variável de ambiente (nunca o valor do token)

# Janela de observação (12 meses, fixada pelo professor na abertura da S01).
# ATENÇÃO — DATAS PROVISÓRIAS: o professor ainda não informou as datas (lacuna L01).
# Os valores abaixo são só para testar (últimos 12 meses em 2026-10-02) e NÃO são oficiais.
# Para trocar, edite apenas estas duas linhas (AAAA-MM-DD, UTC); nada no código depende delas.
# Se mudar a janela depois de coletar, refaça seleção e coleta (e limpe o cache).
janela:
  inicio: 2025-10-02
  fim: 2026-10-02

caminhos:
  cache: cache                   # respostas da API (ignorado pelo Git)
  saidas: outputs                # funil.csv, CSVs finais, etc.

# Seleção de repositórios (S01). O enunciado NÃO define "popular" (lacuna L03) nem
# as faixas de estrelas: os valores abaixo são decisão do grupo (o enunciado só dá
# `stars:1000..2000`, `2000..5000` como exemplo). Mínimos de 5 releases e 50 runs
# válidos vêm do enunciado (E§3).
selecao:
  stars_min: 1000                # piso de estrelas (stars:>=1000)
  faixas_estrelas: [1000, 2000, 5000, 10000, 20000, 50000]  # limites inferiores; última faixa aberta
  linguagens: []                 # [] = sem fatiar por linguagem; ex.: [Python, Java]
  excluir_forks: true
  excluir_arquivados: true
  min_releases: 5
  min_runs_validos: 50
  idade_referencia: fim          # idade = created_at até janela.fim (lacuna L16); ou "inicio"
  amostra_alvo: 100              # tamanho da amostra da S01 (E§10); se mais de 100 passarem nos filtros, o corte
                                 # (primeiros na ordem da seleção) NÃO é definido pela Fonte da Verdade (L17)

# Etapas de coleta por repositório (releases, commits entre releases e runs são sempre coletados).
coleta:
  tags: true                     # tags (variante C3 da RQ07): 1 chamada por commit distinto; false = pula
