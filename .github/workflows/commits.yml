name: commits
on: [push, pull_request]
jobs:
  referencia-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Todo commit novo precisa citar #N
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$BASE_SHA..$HEAD_SHA"
          elif echo "$BEFORE_SHA" | grep -qE '^0+$'; then
            RANGE="$HEAD_SHA^!"   # branch novo: valida só o último commit
          else
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          fi
          status=0
          for sha in $(git rev-list --no-merges "$RANGE"); do
            git log -1 --format=%B "$sha" > /tmp/msg.txt
            python scripts/check_commit_msg.py /tmp/msg.txt || { echo "  -> commit $sha"; status=1; }
          done
          exit $status
